apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-web-lightclient
  labels:
    app: kubernetes-web-lightclient
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kubernetes-web-lightclient
  template:
    metadata:
      labels:
        app: kubernetes-web-lightclient
    spec:
      serviceAccountName: kubernetes-web-lightclient-role
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - image: kubernetes-web-lightclient
          name: data-permissions
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - mountPath: /data
              name: pod-volume
      containers:
        - image: kubernetes-web-lightclient
          name: kubernetes-web-lightclient
          env:
            - name: APPLICATION_TITLE
              value: Kubernetes
          resources:
            limits:
              memory: 500Mi
              cpu: 1
            requests:
              memory: 20Mi
              cpu: 100m
          volumeMounts:
            - mountPath: /data
              name: pod-volume
            - name: config-volume
              mountPath: /opt/app/kubernetes-web-lightclient/config.json
              subPath: config.json
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The entrypoint rewrites the web manifest/config at container
            # start, so the root filesystem cannot be read-only.
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: pod-volume
          persistentVolumeClaim:
            claimName: kubernetes-web-lightclient
        - name: config-volume
          configMap:
            name: kubernetes-web-lightclient-config
